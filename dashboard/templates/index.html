<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Analytics Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#1f2937}header{padding:24px;background:#111827;color:#fff}main{max-width:1100px;margin:24px auto;padding:0 16px}.cards,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card,.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}.grid{margin-top:16px}.value{font-size:28px;font-weight:700;margin-top:8px}canvas{max-height:360px}</style></head><body><header><h1>Cloud Analytics Dashboard</h1><div id="status">Connecting...</div></header><main><section class="cards"><div class="card">Total Orders<div class="value" id="orders">0</div></div><div class="card">Total Sales<div class="value" id="sales">₹0.00</div></div></section><section class="grid"><div class="panel"><h2>Sales by City</h2><canvas id="city"></canvas></div><div class="panel"><h2>Sales by Category</h2><canvas id="category"></canvas></div></section></main><script>let cc,cat;const money=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(v||0);function chart(old,el,labels,data,label){if(old){old.data.labels=labels;old.data.datasets[0].data=data;old.update();return old}return new Chart(el,{type:'bar',data:{labels,datasets:[{label,data}]},options:{responsive:true,animation:false}})}async function refresh(){try{let r=await fetch('/api/analytics',{cache:'no-store'});let d=await r.json();orders.textContent=d.totals.total_orders;sales.textContent=money(d.totals.total_sales);status.textContent='Live • '+(d.totals.updated_at||'never');cc=chart(cc,document.getElementById('city'),d.cities.map(x=>x.city),d.cities.map(x=>x.sales),'Sales');cat=chart(cat,document.getElementById('category'),d.categories.map(x=>x.category),d.categories.map(x=>x.sales),'Sales')}catch(e){status.textContent='API unavailable'}}refresh();setInterval(refresh,3000)</script></body></html>
