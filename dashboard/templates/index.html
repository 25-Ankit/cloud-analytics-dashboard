<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
    header { padding: 24px; background: #111827; color: white; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 16px; }
    .card, .panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .value { font-size: 28px; font-weight: 700; margin-top: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(320px,1fr)); gap: 16px; margin-top: 16px; }
    canvas { max-height: 360px; }
    #status { margin-top: 8px; font-size: 14px; opacity: .8; }
  </style>
</head>
<body>
<header>
  <h1>Cloud Analytics Dashboard</h1>
  <div id="status">Connecting…</div>
</header>
<main>
  <section class="cards">
    <div class="card"><div>Total Orders</div><div class="value" id="orders">0</div></div>
    <div class="card"><div>Total Sales</div><div class="value" id="sales">₹0.00</div></div>
  </section>

  <section class="grid">
    <div class="panel"><h2>Sales by City</h2><canvas id="cityChart"></canvas></div>
    <div class="panel"><h2>Sales by Category</h2><canvas id="categoryChart"></canvas></div>
  </section>
</main>

<script>
let cityChart = null;
let categoryChart = null;

function money(value) {
  return new Intl.NumberFormat("en-IN", {
    style: "currency", currency: "INR", maximumFractionDigits: 2
  }).format(value || 0);
}

function buildChart(existing, element, labels, values, label) {
  if (existing) {
    existing.data.labels = labels;
    existing.data.datasets[0].data = values;
    existing.update();
    return existing;
  }
  return new Chart(element, {
    type: "bar",
    data: { labels, datasets: [{ label, data: values }] },
    options: { responsive: true, animation: false }
  });
}

async function refresh() {
  try {
    const response = await fetch("/api/analytics", { cache: "no-store" });
    if (!response.ok) throw new Error("API error");
    const data = await response.json();

    document.getElementById("orders").textContent = data.totals.total_orders;
    document.getElementById("sales").textContent = money(data.totals.total_sales);
    document.getElementById("status").textContent =
      "Live • Last update: " + (data.totals.updated_at || "never");

    cityChart = buildChart(
      cityChart, document.getElementById("cityChart"),
      data.cities.map(x => x.city),
      data.cities.map(x => x.sales),
      "Sales"
    );

    categoryChart = buildChart(
      categoryChart, document.getElementById("categoryChart"),
      data.categories.map(x => x.category),
      data.categories.map(x => x.sales),
      "Sales"
    );
  } catch (error) {
    document.getElementById("status").textContent = "API unavailable";
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
